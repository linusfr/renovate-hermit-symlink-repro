name: renovate

on:
  workflow_dispatch:
    inputs:
      renovate-version:
        description: Renovate version (44.181.0 and later fail, 44.180.0 works)
        default: 44.222.1

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@v46.3.12
        with:
          renovate-version: ${{ inputs.renovate-version }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: debug
